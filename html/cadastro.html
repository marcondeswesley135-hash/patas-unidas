<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/estilo.css">
    <title>cadastro patas unidas</title>
</head>

<body>

    <form action="#" method="post">
        <fieldset>
            <legend>DADOS PESSOAIS </legend>

            <label for="nome">nome completo </label>
            <input type="text" id="nome" name="nome" required>
            <label for="nascimento">data de nascimento </label>
            <input type="date" id="nascimento" name="nascimento">
        </fieldset>
        <fieldset>
            <legend>contato</legend>
            <label for="telefone">
                telefone</label>
            <input type="tel" id="telefone" name="telefone" pattern="\(\d{2}\) \d{4,5}-\d{4}"
                placeholder="(00) 00000-0000" required>

            <label for="email">email </label>
            <input type="email" id="email" name="email" required>
        </fieldset>
        <fieldset>
            <legend>endereço</legend>
            <label for="cidade">cidade</label>
            <input type="text" id="cidade" name="cidade">
            <label for="estado">estado</label>

            <select name="estado" id="estado">
                <option value="pr">parana</option>
                <option value="sp">sao paulo</option>
            </select>

        </fieldset>
        <fieldset>
            <label for="cpf">cpf</label>
            <input type="text" id="cpf" name="CPF" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" placeholder="000.000.000-00"
                required>
        </fieldset>
        <fieldset>
            <label for="cep">cep</label>
            <input type="text" id="cep" name="cep" pattern="\d{5}-\d{3}" placeholder="00000-000" required>
        </fieldset>
        <button type="submit">enviar cadastro</button>
    </form>

    <!-- mensagem que aparece depois de enviar (controlada pelo js/cadastro.js) -->
    <div id="mensagem" class="alerta alerta-sucesso" role="status" hidden></div>

    <!-- validacao.js vem ANTES, porque o cadastro.js usa a função validarCampo dele -->
    <script src="../js/validacao.js"></script>
    <script src="../js/cadastro.js"></script>
</body>

</html>
